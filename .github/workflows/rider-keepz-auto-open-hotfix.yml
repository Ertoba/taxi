name: Apply Rider Keepz auto-open hotfix

on:
  push:
    paths:
      - .github/workflows/rider-keepz-auto-open-hotfix.yml

permissions:
  contents: write

concurrency:
  group: rider-keepz-auto-open-hotfix
  cancel-in-progress: false

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Rider payment flow fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one source block in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          screen = "lib/presentation/screens/payment/rider_payment_screen.dart"

          replace_once(
              screen,
              """  void initState() {\n    super.initState();\n\n    final bookingCount = box.get(\"bookingCount\") ?? \"0\";\n""",
              """  void initState() {\n    super.initState();\n    context.read<UpdatePaymentByUserCubit>().resetState();\n\n    final bookingCount = box.get(\"bookingCount\") ?? \"0\";\n""",
          )

          replace_once(
              screen,
              """  Widget _buildPaymentMethods(\n    BuildContext context,\n    PaymentMethod? selectedMethod,\n  ) {\n""",
              """  Future<void> _selectPaymentMethod(PaymentMethod method) async {\n    if (!mounted) return;\n\n    context.read<PaymentCubit>().selectMethod(method);\n    context.read<UpdateRideRequestParameterCubit>().updatePaymentMehod(\n      rideId: widget.rideId ?? \"\",\n      paymentMethod: method == PaymentMethod.cash ? \"cash\" : \"online\",\n    );\n\n    if (method != PaymentMethod.online) return;\n\n    await Future<void>.delayed(Duration.zero);\n    if (!mounted) return;\n    await _openKeepzPayment();\n  }\n\n  Widget _buildPaymentMethods(\n    BuildContext context,\n    PaymentMethod? selectedMethod,\n  ) {\n""",
          )

          replace_once(
              screen,
              """      onChanged: (value) {\n        if (value != null) {\n          context.read<PaymentCubit>().selectMethod(value);\n          context.read<UpdateRideRequestParameterCubit>().updatePaymentMehod(\n            rideId: widget.rideId ?? \"\",\n            paymentMethod: value == PaymentMethod.cash ? \"cash\" : \"online\",\n          );\n        }\n      },\n""",
              """      onChanged: (value) {\n        if (value != null) {\n          _selectPaymentMethod(value);\n        }\n      },\n""",
          )

          replace_once(
              screen,
              """        onTap: () {\n          context.read<PaymentCubit>().selectMethod(method);\n          context.read<UpdateRideRequestParameterCubit>().updatePaymentMehod(\n            rideId: widget.rideId ?? \"\",\n            paymentMethod: method == PaymentMethod.cash ? \"cash\" : \"online\",\n          );\n        },\n""",
              """        onTap: () {\n          _selectPaymentMethod(method);\n        },\n""",
          )

          replace_once(
              screen,
              """  Future<void> _openKeepzPayment() async {\n    if (_paymentSheetOpen) return;\n\n    final rideId = widget.rideId?.trim() ?? '';\n""",
              """  Future<void> _openKeepzPayment() async {\n    if (_paymentSheetOpen || _preparingKeepzPayment) return;\n    _preparingKeepzPayment = true;\n\n    final rideId = widget.rideId?.trim() ?? '';\n""",
          )

          replace_once(
              screen,
              """    if (rideId.isEmpty || bookingId.isEmpty) {\n      showErrorToastMessage('Unable to prepare the payment'.translate(context));\n      return;\n    }\n""",
              """    if (rideId.isEmpty || bookingId.isEmpty) {\n      _preparingKeepzPayment = false;\n      showErrorToastMessage('Unable to prepare the payment'.translate(context));\n      return;\n    }\n""",
          )

          replace_once(
              screen,
              """    _preparingKeepzPayment = true;\n    try {\n""",
              """    try {\n""",
          )

          replace_once(
              "pubspec.yaml",
              "version: 1.0.6+12",
              "version: 1.0.7+13",
          )

          Path('.github/workflows/rider-keepz-auto-open-hotfix.yml').unlink()
          PY

          git diff --check

      - name: Commit Rider hotfix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/presentation/screens/payment/rider_payment_screen.dart \
            pubspec.yaml \
            .github/workflows/rider-keepz-auto-open-hotfix.yml
          git commit -m "Open Keepz checkout when online payment is selected"
          git push origin HEAD:main
