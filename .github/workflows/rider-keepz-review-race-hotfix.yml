name: Apply Rider Keepz review race fix

on:
  push:
    paths:
      - .github/workflows/rider-keepz-review-race-hotfix.yml
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: rider-keepz-review-race-hotfix
  cancel-in-progress: true

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Rider payment modal lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          payment = Path('lib/presentation/screens/payment/rider_payment_screen.dart')
          text = payment.read_text()

          old = """        if (state is UpdatePaymentSuceess) {
          Widgets.hideLoder(context);
          if (_preparingKeepzPayment) return;
          clearAllRiderData(context);
          showModalBottomSheet(
            context: context,
            enableDrag: false,
            isScrollControlled: true,
            backgroundColor: Colors.transparent,
            builder: (context) =>
                CustomReviewWidget(bookingId: widget.bookingId),
          );
        } else if (state is UpdatePaymentFailure) {
"""

          new = """        if (state is UpdatePaymentSuceess) {
          // This response only confirms that Keepz checkout preparation
          // succeeded. Review opens later from paymentStatus=collected.
          Widgets.hideLoder(context);
        } else if (state is UpdatePaymentFailure) {
"""

          matches = text.count(old)
          if matches != 1:
              raise SystemExit(f'Expected one payment listener block, found {matches}')
          payment.write_text(text.replace(old, new, 1))

          pubspec = Path('pubspec.yaml')
          version_text = pubspec.read_text()
          if 'version: 1.0.7+14' in version_text:
              version_text = version_text.replace(
                  'version: 1.0.7+14',
                  'version: 1.0.8+15',
                  1,
              )
          elif 'version: 1.0.8+15' not in version_text:
              raise SystemExit('Unexpected Rider version')
          pubspec.write_text(version_text)

          Path('.github/workflows/rider-keepz-review-race-hotfix.yml').unlink()
          PY

          git diff --check
          grep -q 'Review opens later from paymentStatus=collected' \
            lib/presentation/screens/payment/rider_payment_screen.dart
          ! grep -A15 'if (state is UpdatePaymentSuceess)' \
            lib/presentation/screens/payment/rider_payment_screen.dart | \
            grep -q 'CustomReviewWidget'

      - name: Commit fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/presentation/screens/payment/rider_payment_screen.dart \
            pubspec.yaml \
            .github/workflows/rider-keepz-review-race-hotfix.yml
          git commit -m "Prevent review sheet before Keepz payment success"
          git push origin HEAD:main
